            font-size: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 1px 1px 25px 10px rgba(0, 0, 0, 0.4);
        }

        .btn-main:before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,

                    rgba(255, 255, 255, 0.4),

        @keyframes shine {
            0% {
