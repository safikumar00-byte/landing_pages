        let toggle = true;

        setInterval(function () {
            if (toggle) {
                document.querySelector('.transition').classList.add('slide-up');

                document.querySelector('.transition-1').classList.remove('slide-up');
                document.querySelector('.transition-1').style.display = 'none';
            } else {
                document.querySelector('.transition').classList.remove('slide-up');
                document.querySelector('.transition').style.display = 'none';
                document.querySelector('.transition-1').classList.add('slide-up');
                document.querySelector('.transition-1').style.display = 'block';

            }
