    <script>
        const canvas = document.getElementById("scratchCanvas");
        const ctx = canvas.getContext("2d");
        const prizeDiv = document.getElementById("popup");

        let isDrawing = false;
        let totalScratched = 0;
        const scratchRadius = 15;
        const scratchThreshold = 0.6; // 60% scratched
        let count = 3;

        // Initialize scratch card
        function initializeScratchCard() {
            // Fill the canvas with a scratchable surface
            ctx.fillStyle = "#EEBF5D";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "20px Arial";
            ctx.fillStyle = "#000";
            ctx.textAlign = "center";
            ctx.fillText("Scratch Here!", canvas.width / 2, canvas.height / 2);
        }


        // Handle pointer down
        function handlePointerDown(e) {
            e.preventDefault();
            isDrawing = true;
            scratch(e);
        }

        // Handle pointer move
        function handlePointerMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            scratch(e);
        }

        // Handle pointer up/cancel
        function handlePointerUp(e) {
            if (!isDrawing) return;
            isDrawing = false;
            checkScratchCompletion();
        }

        // Scratch function
        function scratch(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.globalCompositeOperation = "destination-out";
            ctx.beginPath();
            ctx.arc(x, y, scratchRadius, 0, Math.PI * 2, false);
            ctx.fill();

            // Update scratched area
            updateScratchedPercentage();
        }

        // Calculate scratched area
        function updateScratchedPercentage() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const totalPixels = pixels.length / 4; // Each pixel has RGBA
            let transparentPixels = 0;

            for (let i = 0; i < pixels.length; i += 4) {
                if (pixels[i + 3] === 0) {
                    // Alpha channel
                    transparentPixels++;
                }
            }

            const scratchedPercentage = transparentPixels / totalPixels;

            if (scratchedPercentage > scratchThreshold) {
                revealPrize();
            }
        }

        // Reveal prize
        function revealPrize() {
            document.querySelector(".prize").classList.add("bounce");
            document.querySelector(".prize").classList.add('z-index-11');
            document.getElementById("canvas").style.display = "block";
            document.getElementById("scratchCanvas").style.display = "none";

            poppers();
            setTimeout(() => {

                if (count < 3) {
                    prizeDiv.classList.replace('d-none', 'd-flex');
                    document.body.style.overflow = "hidden";
                    document.querySelector('.offer_amount').classList.replace('d-block', 'd-none');
                    document.querySelector('.offer_img').classList.replace('d-none', 'd-flex');
                } else {
                    prizeDiv.classList.replace('d-none', 'd-flex');
                    document.body.style.overflow = "hidden";
                }
            }, 1000);
        }

        function closepopup() {
            let popupCon = document.querySelector('.popup');
            if (popupCon) {
                popupCon.classList.replace('d-flex', 'd-none');
            }

            // Reset the z-index of the prize element
            document.querySelector(".prize").classList.remove('z-index-11');
            document.querySelector(".prize").classList.remove("bounce");
            document.querySelector(".offer-steps").classList.remove("d-none");
            document.querySelector(".prize").style.background = 'url(./assets/prize.webp) center/cover no-repeat';


            // Reset the scratch card after closing the popup
            resetScratchCard();
            count--;
            document.querySelector('.scratches_left').innerHTML = count;

        }

        function resetScratchCard() {
            // Clear the canvas completely
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reset the globalCompositeOperation to normal drawing mode
            ctx.globalCompositeOperation = "source-over";

            // Reinitialize the scratchable surface
            if (count <= 1) {
                // Display a message if no scratches are left
                ctx.fillStyle = "#e3e3e3";
                ctx.fillRect(0, 0, canvas.width, canvas.height); // Fill background
                ctx.fillStyle = "#000"; // Text color
                ctx.textAlign = "center";
                ctx.font = "20px Arial";
                ctx.fillText("No Scratches Left! Try Tomorrow", canvas.width / 2, canvas.height / 2);
                // document.querySelector('.scratches_left').styl.color = 'red';


                // Disable scratching interactions
                canvas.removeEventListener("pointerdown", handlePointerDown);
                canvas.removeEventListener("pointermove", handlePointerMove);
                canvas.removeEventListener("pointerup", handlePointerUp);
            } else {
                // Set up the scratchable canvas if scratches are left

                ctx.fillStyle = "#EEBF5D"; // Scratchable surface color
                ctx.fillRect(0, 0, canvas.width, canvas.height); // Fill the scratch layer

                // Add the "Scratch Here!" text over the surface
                ctx.font = "20px Arial";
                ctx.fillStyle = "#000";
                ctx.textAlign = "center";
                ctx.fillText("Scratch Here!", canvas.width / 2, canvas.height / 2);

                // Re-enable the scratchable surface
                initializeScratchCard();

                // Re-enable interaction
                canvas.addEventListener("pointerdown", handlePointerDown);
                canvas.addEventListener("pointermove", handlePointerMove);
                canvas.addEventListener("pointerup", handlePointerUp);
            }

            // Show the scratch canvas again and hide the prize div
            document.getElementById("canvas").style.display = "none"; // Hide the prize
            document.getElementById("scratchCanvas").style.display = "block"; // Show the scratch canvas

            // Reset the scratch tracking variables
            isDrawing = false;
            totalScratched = 0;

            // Allow scrolling again
            document.body.style.overflow = "auto";

        }

        // Add pointer event listeners
        canvas.addEventListener("pointerdown", handlePointerDown);
        canvas.addEventListener("pointermove", handlePointerMove);
        canvas.addEventListener("pointerup", handlePointerUp);
        canvas.addEventListener("pointercancel", handlePointerUp);

        // Initialize the scratch card on page load
        initializeScratchCard();
    </script>
