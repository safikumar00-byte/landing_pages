    <script>
        $(document).ready(function () {

            $('#withdrawBtn').on('click', function () {
                $('.payment_interface').show();
            })

            $('.payment_interface').hide();

            let walletAmount = 0;
            $(".wallet-amount").text(`₹${walletAmount.toFixed(2)}`);
            $(".payment-amount").text(`₹${walletAmount.toFixed(2)}`);

            $('.backBtn').on('click', function () {
                $('.payment_interface').hide();
            })

            function restrictToNumbers(event) {
                const key = event.which || event.keyCode;
                if (key < 48 || key > 57) {
                    event.preventDefault();
                }
            }

            function restrictToAlphabets(event) {
                const key = event.which || event.keyCode;
                if ((key < 65 || key > 90) && (key < 97 || key > 122) && key !== 32) {
                    event.preventDefault();
                }
            }

            $('#mobileNumber, #accountNo, #confirmAccountNo').on('keypress', restrictToNumbers);
            $('#beneficiaryNameUpi, #beneficiaryNameBank').on('keypress', restrictToAlphabets);

            $('#transferAmount').on('focus', function () {
                $(this).val(walletAmount.toFixed(2));
            });

            $('#mobileNumber').on('blur', function () {
                const mobileNumber = $(this).val();
                $('#mobileError').text('');

                if (!/^[6-9]\d{9}$/.test(mobileNumber)) {
                    $('#mobileError').text('Invalid mobile number');
                }
            });

            $('#upiId').on('blur', function () {
                const upiId = $(this).val();
                $('#upiError').text('');

                const upiPattern = /^[0-9]{10}@[a-zA-Z0-9.-]+$/;

                if (!upiPattern.test(upiId)) {
                    $('#upiError').text('Invalid UPI ID. Must be 10 digits followed by @domain.');
                }
            });

            $('#transferAmount').on('blur', function () {
                const transferAmount = parseFloat($(this).val());
                $('#amountError').text('');

                if (isNaN(transferAmount) || transferAmount <= 0) {
                    $('#amountError').text('Invalid amount');
                } else if (transferAmount > walletAmount) {
                    $('#amountError').text('Amount exceeds wallet balance');
                }
            });

            $('#accountNo, #confirmAccountNo').on('blur', function () {
                const accountNo = $('#accountNo').val();
                const confirmAccountNo = $('#confirmAccountNo').val();
                $('#accountError, #confirmAccountError').text('');

                if (accountNo.length < 9 || accountNo.length > 18) {
                    $('#accountError').text('Invalid account number');
                }

                if (confirmAccountNo !== accountNo) {
                    $('#confirmAccountError').text('Account numbers do not match');
                }
            });

            $('#ifsc').on('blur', function () {
                const ifsc = $(this).val();
                $('#ifscError').text('');

                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) {
                    $('#ifscError').text('Invalid IFSC code');
                }
            });

            function enableSubmitBtn() {
                const upiFormValid = $('#upiId').val() && $('#mobileNumber').val() && $('#beneficiaryNameUpi').val() && $('#transferAmount').val();
                const bankFormValid = $('#accountNo').val() && $('#confirmAccountNo').val() && $('#ifsc').val() && $('#beneficiaryNameBank').val() && $('#transferAmountBank').val();
                $('#bankSubmitBtn').prop('disabled', !(upiFormValid || bankFormValid));
            }

            $('#upiForm, #bankForm input').on('input', enableSubmitBtn);

            $('#upi-tab').on('click', function () {
                $('#upi').addClass('active show');
                $('#bank').removeClass('active show');
                $('#upi-tab').addClass('active');
                $('#bank-tab').removeClass('active');

            });

            $('#bank-tab').on('click', function () {
                $('#bank').addClass('active show');
                $('#upi').removeClass('active show');
                $('#bank-tab').addClass('active');
                $('#upi-tab').removeClass('active');
            });

        });

        body.style.overflow = 'hidden';

        function closeofferslist() {
            document.querySelector('.offers-con').classList.replace('d-flex', 'd-none');
        }

        function closeoffer() {
            // document.querySelector('.card').classList.add('close');
            document.querySelector('.display-card-con').classList.add('slide-in-top');
        }

        function showoffers() {
            console.log('working')
            document.querySelector('.offers-con').classList.replace('d-none', 'd-flex');
        }

        function shareReferral() {
            if (navigator.share) {
                navigator.share({
                    title: document.title, // Page title
                    text: 'Check out this page!',
                    url: window.location.href // Current page URL
                })
                    .then(() => console.log('Share successful'))
                    .catch((error) => console.error('Error sharing:', error));
            } else {
                console.log('Web Share API not supported in this browser.');
            }

        }
    </script>

.glasp-md.glasp-md a { color: rgb(51 121 255); text-decoration: none; }
.glasp-md.glasp-md a:hover { text-decoration: underline; }
.glasp-md.glasp-md blockquote {
  margin: 0.6em 0; padding-block: 0.1em; padding-inline: 0.85em 0;
  border-inline-start: 3px solid #dfe3ea; color: #5b616e;
}
.glasp-md.glasp-md blockquote p { margin: 0.25em 0; }
.glasp-md.glasp-md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em;
  background: #f1f5f9; color: #1f2937; padding: 0 3px; border-radius: 3px;
}
.glasp-md.glasp-md pre {
  background: #f1f5f9; color: #1f2937; padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0.4em 0;
}
.glasp-md.glasp-md pre code { background: none; padding: 0; }
/* Code is ALWAYS left-to-right, whatever the surrounding text does. Without this,
   an RTL host page — or a dir=auto container that resolved RTL from an Arabic
   first character — reorders every code line: an opening brace jumps to the far
   end, and a leading comment marker lands on the wrong side. unicode-bidi
   isolate also stops the code from reordering the prose around it.
   NOTE: no backticks in this comment. It lives inside a JS template literal. */
.glasp-md.glasp-md pre, .glasp-md.glasp-md code { direction: ltr; unicode-bidi: isolate; text-align: start; }
.glasp-md.glasp-md img { max-width: 100%; border-radius: 2px; }
