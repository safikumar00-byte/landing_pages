    <style>
        .dots {
            height: 30px;
            width: 30px;
            border-radius: 50%;
        }


        .dots:nth-child(1) {
            margin-left: -12px;
        }

        .dots:last-child {
            margin-right: -12px;
        }

        .bg-custom {
            background-color: #0d3642;
        }

        .line {
            border: 1px solid transparent;
            border-image: repeating-linear-gradient(to right, #dee2e6 0, #dee2e6 10px, transparent 10px, transparent 20px) 1;
            box-shadow: inset 4px 0px 7px rgba(0, 0, 0, 0.25);
        }

        .text-success {
            color: #3fc700 !important;
        }

        .dashed {
            border: 1px dashed #3fc700;
        }

        .tick::before {
            content: "";
            height: 75px;
            width: 75px;
            background-color: #fff;
            background-image: url('./assets/tick.png');
            background-position: center;
            /* border: 1px solid #fff; */
            background-size: 85px 85px;
            border-radius: 50%;
            display: inline-block;
            position: absolute;
            transform: translate(-35px, -60px);
        }

        .data {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .inset-shadow {
            box-shadow: inset 5px 0px 7px rgba(0, 0, 0, 0.10);
            /* Example shadow */
        }

        .inset-shadow-1 {
            box-shadow: inset -5px 0px 7px rgba(0, 0, 0, 0.10);
            /* Example shadow */
        }

        .points {
            display: flex;
            border-radius: 10px;
            gap: 10px;
            align-items: center;
            /* justify-content: center; */
        }

        .points p {
            margin: 0;
        }

        .apply {
            font-size: 20px;
            font-weight: 600;
        }

        .pre-loader {
            height: 90vh;
        }

        .pre-loader-text {
            margin-top: -100px;
        }

        .fade-in {
            -webkit-animation: fade-in 1.2s cubic-bezier(0.390, 0.575, 0.565, 1.000) both;
            animation: fade-in 1.2s cubic-bezier(0.390, 0.575, 0.565, 1.000) both;
        }

        @-webkit-keyframes fade-in {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .fade-out {
            animation: fade-out 1s ease-out both;
        }

        @keyframes fade-out {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .slide-in-bottom {
            animation: slide-in-bottom 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }


        @keyframes slide-in-bottom {
            0% {
                transform: translateY(1000px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media only screen and (min-width: 768px) {
            body {
                display: none;
            }
        }
    </style>
