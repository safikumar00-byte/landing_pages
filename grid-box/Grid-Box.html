    <script>

      window.onload = function () {
        const preLoader = document.querySelector(".pre-loader");
        preLoader.style.transition = "opacity 2s";
        preLoader.style.opacity = "0";
        setTimeout(() => {
          preLoader.style.display = "none";
        }, 2000);
      }

      // Scratch Card Effect
      const scratchArea = document.getElementById("scratch-area");
      const ctx = scratchArea.getContext("2d");
      const img = new Image();
      img.src = "assets/scratch.jpg"; // Replace with your image path

      img.onload = function () {
        ctx.drawImage(img, 0, 0, scratchArea.width, scratchArea.height);
      };

      let isDrawing = false;

      function scratchStart(event) {
        isDrawing = true;
        scratch(event);
      }

      function scratch(event) {
        if (!isDrawing) return;

        const rect = scratchArea.getBoundingClientRect();
        const x = event.touches
          ? event.touches[0].clientX - rect.left
          : event.clientX - rect.left;
        const y = event.touches
          ? event.touches[0].clientY - rect.top
          : event.clientY - rect.top;

        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      function scratchEnd() {
        isDrawing = false;
      }

      scratchArea.addEventListener("touchstart", scratchStart);
      scratchArea.addEventListener("touchmove", scratch);
      scratchArea.addEventListener("touchend", scratchEnd);
      scratchArea.addEventListener("mousedown", scratchStart);
      scratchArea.addEventListener("mousemove", scratch);
      scratchArea.addEventListener("mouseup", scratchEnd);

      // Animation
      function animation() {
        document.querySelector(".head").style.opacity = "0.5";
        document.querySelector(".hand").style.display = "none";
        const elements = document.querySelectorAll(".card-item");

        elements.forEach((element) => {
          element.classList.add("start");
        });

        setTimeout(() => {
          elements.forEach((element) => element.classList.add("second"));
        }, 1900);

        setTimeout(() => {
          elements.forEach((element) => element.classList.add("third"));
        }, 3800);

        setTimeout(showImage, 6000);
      }

      function showImage() {
        document.getElementById("main").style.cssText =
          "z-index: 2; height: 100vh; top: -15%; background-color: rgb(0 0 0 / 70%);";

    <script>
      let W = window.innerWidth;
      let H = window.innerHeight;
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");
      const maxConfettis = 10;
      const particles = [];

      const possibleColors = [
        "DodgerBlue",
        "OliveDrab",
        "Gold",
        "Pink",
        "SlateBlue",
        "LightBlue",
        "Gold",
        "Violet",
        "PaleGreen",
        "SteelBlue",
        "SandyBrown",
        "Chocolate",
        "Crimson"
      ];

      function randomFromTo(from, to) {
        return Math.floor(Math.random() * (to - from + 1) + from);
      }

      function confettiParticle() {
        this.x = Math.random() * W; // x
        this.y = Math.random() * H - H; // y
        this.r = randomFromTo(11, 33); // radius
        this.d = Math.random() * maxConfettis + 11;
        this.color =
          possibleColors[Math.floor(Math.random() * possibleColors.length)];
        this.tilt = Math.floor(Math.random() * 33) - 11;
        this.tiltAngleIncremental = Math.random() * 0.07 + 0.05;
        this.tiltAngle = 0;

        this.draw = function () {
          context.beginPath();
          context.lineWidth = this.r / 2;
          context.strokeStyle = this.color;
          context.moveTo(this.x + this.tilt + this.r / 3, this.y);
          context.lineTo(this.x + this.tilt, this.y + this.tilt + this.r / 5);
          return context.stroke();
        };
      }

      function Draw() {
        const results = [];

        // Magical recursive functional love
        requestAnimationFrame(Draw);

        context.clearRect(0, 0, W, window.innerHeight);

        for (var i = 0; i < maxConfettis; i++) {
          results.push(particles[i].draw());
        }

        let particle = {};
        let remainingFlakes = 0;
        for (var i = 0; i < maxConfettis; i++) {
          particle = particles[i];

          particle.tiltAngle += particle.tiltAngleIncremental;
          particle.y += (Math.cos(particle.d) + 3 + particle.r / 2) / 2;
          particle.tilt = Math.sin(particle.tiltAngle - i / 3) * 15;

          if (particle.y <= H) remainingFlakes++;

          // If a confetti has fluttered out of view,
          // bring it back to above the viewport and let if re-fall.
          if (particle.x > W + 30 || particle.x < -30 || particle.y > H) {
            particle.x = Math.random() * W;
            particle.y = -30;
            particle.tilt = Math.floor(Math.random() * 10) - 20;
          }
        }

        return results;
      }

      window.addEventListener(
        "resize",
        function () {
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        },
        false
      );

      // Push new confetti objects to `particles[]`
      for (var i = 0; i < maxConfettis; i++) {
        particles.push(new confettiParticle());
      }

      // Initialize
      canvas.width = W;
      canvas.height = H;
      Draw();
    </script>
