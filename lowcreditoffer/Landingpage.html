    <style>
        body {
            display: flex;
            /* justify-content: center; */
            height: 100vh;
            flex-direction: column;
            background-image: url(./assets/APPROVED.png);
            background-size: 18%;
        }

        .btn-primary {
            border: 0px solid transparent !important;
        }

        .btn-default {
            font-weight: 700 !important;
            font-size: 20px;
        }

        .loader-con {
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: white;
        }

        .loader {
            width: 100px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 16px solid;
            border-color: #000 #0000;
            animation: l1 1s infinite;
        }

        @keyframes l1 {
            to {
                transform: rotate(.5turn)
            }
        }

        .loader-text {
            font-size: 1.3rem;
            transition: all 0.5s;
            font-weight: 600;
        }

        .details {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .points {
            display: flex;
            border-radius: 10px;
            gap: 10px;
            align-items: center;
            /* justify-content: center; */
        }

        .points p {
            margin: 0;
        }

        .offers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;


        }

        .offer-details {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            /* gap: 20px; */
        }

        .verifications {
            display: flex;
            gap: 5px;
            flex-direction: column;
            border-radius: 20px;
        }

        .feature-text {
            font-size: 0.8rem;
            margin: 0;
        }

        .amount {
            font-size: 2rem;
            font-weight: 700;
        }

        .main {
            display: flex;
            flex-direction: column;
            margin-top: 150px;
            height: fit-content;

        }

        .swipe {
            animation: swipe 0.5s ease 1 forwards;
        }

        @keyframes swipe {
            0% {
                transform: translateY(300px);
                opacity: 0.5;
            }

            100% {
                transform: translateY(0px);
                opacity: 1;
            }
        }

        @media only screen and (min-width: 768px) {
            body {
                display: none;
            }
        }

        .offer-details {
            margin-top: -90px;
            position: relative;
        }

        li {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        li small {
            font-size: 0.7rem;
        }

        .approved {
            border-color: #3fc700 !important;
            color: #3fc700;
            /* font-size: 20px; */
            /* position: absolute; */
        }

        .rounded-4 {
            border-radius: 20px 20px 0px 0px !important;
        }

        .tick {
            display: none;
        }
    </style>

    <script>
        const loaderText = document.querySelector('.loader-text');
        const dotsSpan = document.querySelector('.dots');

        const logoElement = document.getElementById('logo');
        const body = document.body;


        function getParameterByName(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const logoUrl = getParameterByName('id');
        if (logoUrl) {
            logoElement.src = './assets/' + logoUrl + '.jpg';
        }

        function changeColorByLogo(logoSrc) {
            if (logoSrc.includes('adityabirla.jpg')) {
                body.style.backgroundColor = "#D92227";
                body.style.background = 'linear-gradient(180deg, #D92227, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#D92227';
                document.querySelector('.btn-default').style.color = '#fff';
                document.querySelector('.amount').textContent = "Rs.10,00,000*";

            }
            else if (logoSrc.includes('indifi.jpg')) {
                body.style.backgroundColor = "#0032A1";
                body.style.background = 'linear-gradient(180deg, #0032A1, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#03BC71';
                document.querySelector('.btn-default').style.color = '#fff';
                document.querySelector('.amount').textContent = "Rs.50,00,000*";

            }
            else if (logoSrc.includes('lendingkart.jpg')) {
                body.style.backgroundColor = "#1571B6";
                body.style.background = 'linear-gradient(180deg, #1571B6, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#FF6700';
                document.querySelector('.btn-default').style.color = '#fff';
                document.querySelector('.amount').textContent = "Rs. 2 Crore";

            }
            else if (logoSrc.includes('flexiloan.jpg')) {
                body.style.backgroundColor = "#2B5582";
                body.style.background = 'linear-gradient(180deg, #2B5582, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#8E213C';
                document.querySelector('.btn-default').style.color = '#fff';
                document.querySelector('.amount').textContent = "Rs 1 Crore";

            }
            else if (logoSrc.includes('incred.jpg')) {
                body.style.backgroundColor = "#F37C20";
                body.style.background = 'linear-gradient(180deg, #F37C20, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#0E489A';
                document.querySelector('.btn-default').style.color = '#fff';
                document.querySelector('.amount').textContent = "Rs.10,00,000*";

            }
            else if (logoSrc.includes('bajaj.jpg')) {
                body.style.backgroundColor = "#0072BB";
                body.style.background = 'linear-gradient(180deg, #0072BB, transparent)';
                document.querySelector('.btn-default').style.backgroundColor = '#FFFFFF';
                document.querySelector('.btn-default').style.color = '#0072BB';
                document.querySelector('.btn-default').style.border = '1px solid #0072BB';
            }
        }

        const currentLogoSrc = logoElement.src;
        changeColorByLogo(currentLogoSrc);

        function animateDots() {
            let dots = '';
            let count = 0;
            setInterval(() => {
                dots = '.'.repeat(count % 4);
                dotsSpan.textContent = dots;
                count++;
            }, 500);
        }

        animateDots();

        document.querySelector('.apply').addEventListener('click', loader);

        function loader() {
            document.querySelector('.loader-con').classList.remove('d-none');

            setTimeout(() => {
                document.querySelector('.loader-text').innerHTML = "Identifying Right offers for you<span class='p-0 m-0 dots'>...</span>";
            }, 1500);

            setTimeout(() => {
                document.querySelector('.loader').style.display = 'none';
                document.querySelector('.tick').style.display = "block";
                document.getElementById('lottie').play();
                document.querySelector('.loader-text').innerHTML = "Super, we found a right offer for you";
            }, 3000);

            setTimeout(() => {
                window.location.href = 'https://www.google.com/';
                body.style.overflow = 'visible';
            }, 6000);
        }

    </script>
