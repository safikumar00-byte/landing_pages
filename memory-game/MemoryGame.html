    <script>
        let flippedCards = [];
        const cards = document.querySelectorAll('.card'); // Get all cards
        const frontImages = document.querySelectorAll('.front img'); // Get all front images;
        const gameBoard = document.querySelector('.game-board'); // Get the game board

        // Apply blinking effect with a staggered delay and remove after 5 seconds
        window.onload = function () {
            setInterval(() => {
                let previousNum = -1;
                let randNum;
                do {
                    randNum = Math.floor(Math.random() * 6);
                } while (randNum === previousNum);
                previousNum = randNum;
                frontImages[randNum].classList.add('blink');
                setTimeout(() => {
                    frontImages[randNum].classList.remove('blink');
                }, 1000);
            }, 2000); // Runs every 2 seconds
        };

        function flipCard(card) {
            // Prevent interaction if game board is disabled
            if (card.classList.contains('blocked') || gameBoard.classList.contains('disabled')) return;

            card.classList.add('flip'); // Add flip animation

            if (!flippedCards.includes(card)) {
                flippedCards.push(card);
            }

            // Add glow effect after a short delay
            setTimeout(() => {
                card.classList.add('glow'); // Apply glow effect
            }, 500); // Adjust delay as needed

            if (flippedCards.length === 3) {
                blockOtherCards(); // Block other cards
                setTimeout(checkMatch, 600); // Wait for flip animations to finish
            }
        }

        function blockOtherCards() {
            cards.forEach(card => {
                if (!flippedCards.includes(card)) {
                    card.classList.add('blocked'); // Add a visual cue to blocked cards
                }
            });
        }

        function unblockAllCards() {
            cards.forEach(card => {
                card.classList.remove('blocked'); // Remove the blocked state
            });
        }

        function checkMatch() {
            const [firstCard, secondCard, thirdCard] = flippedCards;
            const firstImg = firstCard.querySelector('.front img').src;
            const secondImg = secondCard.querySelector('.front img').src;
            const thirdImg = thirdCard.querySelector('.front img').src;

            if (firstImg === secondImg && secondImg === thirdImg) {
                displayPopup(); // Show the popup when the match is found
            }

            flippedCards.forEach(card => {
                card.classList.remove('flip');
                card.classList.remove('glow'); // Remove glow effect after match check
            });

            flippedCards = [];
            unblockAllCards(); // Unblock cards after the turn
        }

        function displayPopup() {
            const popup = document.querySelector('.popup');
            popup.style.display = "flex"; // Show the popup

            // Disable interaction with the game board
            gameBoard.classList.add('disabled');

            startCountdown(); // Start the countdown timer
        }

        function startCountdown() {
            let time = 90; // 1 minute 30 seconds in seconds
            const timerElement = document.getElementById("timer");

            const countdown = setInterval(() => {
                const minutes = Math.floor(time / 60);
                const seconds = time % 60;
                timerElement.textContent = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
                time--;

                if (time < 0) {
                    clearInterval(countdown); // Stop timer
                }
            }, 1000);
        }
    </script>

    <script>
        let W = window.innerWidth;
        let H = window.innerHeight;
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");
        const maxConfettis = 10;
        const particles = [];

        const possibleColors = [
            "DodgerBlue",
            "OliveDrab",
            "Gold",
            "Pink",
            "SlateBlue",
            "LightBlue",
            "Gold",
            "Violet",
            "PaleGreen",
            "SteelBlue",
            "SandyBrown",
            "Chocolate",
            "Crimson"
        ];

        function randomFromTo(from, to) {
            return Math.floor(Math.random() * (to - from + 1) + from);
        }

        function confettiParticle() {
            this.x = Math.random() * W; // x
            this.y = Math.random() * H - H; // y
            this.r = randomFromTo(11, 33); // radius
            this.d = Math.random() * maxConfettis + 11;
            this.color =
                possibleColors[Math.floor(Math.random() * possibleColors.length)];
            this.tilt = Math.floor(Math.random() * 33) - 11;
            this.tiltAngleIncremental = Math.random() * 0.07 + 0.05;
            this.tiltAngle = 0;

            this.draw = function () {
                context.beginPath();
                context.lineWidth = this.r / 2;
                context.strokeStyle = this.color;
                context.moveTo(this.x + this.tilt + this.r / 3, this.y);
                context.lineTo(this.x + this.tilt, this.y + this.tilt + this.r / 5);
                return context.stroke();
            };
        }

        function Draw() {
            const results = [];

            // Magical recursive functional love
            requestAnimationFrame(Draw);

            context.clearRect(0, 0, W, window.innerHeight);

            for (var i = 0; i < maxConfettis; i++) {
                results.push(particles[i].draw());
            }

            let particle = {};
            let remainingFlakes = 0;
            for (var i = 0; i < maxConfettis; i++) {
                particle = particles[i];

                particle.tiltAngle += particle.tiltAngleIncremental;
                particle.y += (Math.cos(particle.d) + 3 + particle.r / 2) / 2;
                particle.tilt = Math.sin(particle.tiltAngle - i / 3) * 15;

                if (particle.y <= H) remainingFlakes++;

                // If a confetti has fluttered out of view,
                // bring it back to above the viewport and let if re-fall.
                if (particle.x > W + 30 || particle.x < -30 || particle.y > H) {
                    particle.x = Math.random() * W;
                    particle.y = -30;
                    particle.tilt = Math.floor(Math.random() * 10) - 20;
                }
            }

            return results;
        }

        window.addEventListener(
            "resize",
            function () {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            },
            false
        );

        // Push new confetti objects to particles[]
        for (var i = 0; i < maxConfettis; i++) {
            particles.push(new confettiParticle());
        }

        // Initialize
        canvas.width = W;
        canvas.height = H;
        Draw();
    </script>
